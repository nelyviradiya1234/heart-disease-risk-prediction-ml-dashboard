<!DOCTYPE html>
<html>
<head>
    <title>Healthcare ML Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            text-align: center;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            margin-top: 50px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        h2 {
            color: #2c3e50;
        }

        input, select {
            width: 90%;
            padding: 8px;
            margin: 8px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button {
            background: #2ecc71;
            color: white;
            padding: 10px;
            border: none;
            width: 95%;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Heart Disease Prediction</h2>

    <form action="/predict" method="post">

        <input type="number" step="any" name="feature1" placeholder="Age" required>
        <input type="number" step="any" name="feature2" placeholder="Blood Pressure" required>
        <input type="number" step="any" name="feature3" placeholder="Cholesterol" required>
        <input type="number" step="any" name="feature4" placeholder="Max Heart Rate" required>
        <input type="number" step="any" name="feature5" placeholder="Oldpeak" required>

        <select name="model">
            <option>Logistic Regression</option>
            <option>Decision Tree</option>
            <option>Random Forest</option>
        </select>

        <button type="submit">Predict Risk</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>
</div>

</body>
</html>
